---

- name: 'Install Vim and related packages'
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
  loop:

    # Vim.
    # - Debian includes 'vim-tiny' by default.
    # - HSTRY: I used to build Vim from sources,
    #   back when I wanted to customize its Alt-Tab
    #   icon, also so I take advantage of features
    #   that hadn't yet been released to distro sources
    #   (e.g., 'timers'). But nowadays the distro
    #   package usually has everything I need.
    - vim-gtk3

    # TRYIT/2023-03-24: Someday I'll demo neovim...
    - neovim

    # Text columnizer. (Replaced by custom fork: parT)
    #   #- par

    # Exuberant Ctags.
    - exuberant-ctags
    # Universal Ctags. "A maintained ctags implementation." /oh-burn
    # https://github.com/universal-ctags/ctags
    - universal-ctags

    # Ruby dev tools for Command-T.
    - ruby-dev

    # Libraries needed to build Vim. See also:
    #   sudo apt-get -s build-dep vim
    # (provided you have update sources.list,
    #  which these Zoidy Pooh Ansible Roles do not).

    - libncurses5-dev
    # ncursesw is ncurses with Unicode (wide character) support.
    - libncursesw5-dev

    # HSTRY/2025-01-15: At least for obsolete GTK 2.0 Vim,
    # without GTK lib ('libgtk2.0-dev'), Vim builds, but gvim
    # symlink is not made (and if you make it and run it,
    # complains):
    #   # Missing 'libgtk2.0-dev' at compile-time.
    #   $ gvim
    #   E25: GUI cannot be used: Not enabled at compile time
    - libgtk-3-dev

# ***
