---

- name: 'Install spatial packages'
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
  loop:

    # Cartographic projection packages.
    # libproj-dev - Cartographic projection library (development files)
    - libproj-dev
    # proj-bin - Cartographic projection library (tools)
    - proj-bin
    # proj-data - Cartographic projection filter and library (datum package)
    - proj-data

    # ogrinfo et al.
    # gdal-bin - Geospatial Data Abstraction Library - Utility programs
    # node-srs - spatial reference library for Node.js
    - gdal-bin

    # gpx2shp missing in 22.04.
    # - Package page last updated 2014, so might no longer be supported
    #     https://gpx2shp.osdn.jp/
    # - Or might have been rolled into `gis-gps` (but doubt it).
    # Circa Ubuntu 18.04:
    #   # gpx2shp - convert GPS or GPX file to ESRI Shape file
    #   - gpx2shp

# ***

- name: 'Install distro-specific acbde-related packages (Debian 12)'
  when: ansible_lsb.id == 'Debian' and ansible_lsb.major_release|int == 12
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
  loop:
    # libproj25 - Cartographic projection library
    - libproj25
    # libspatialite7 - Geospatial extension for SQLite - libraries
    - libspatialite7

- name: "Install Ruby and related packages (Mint 21)"
  when: ansible_lsb.id == 'LinuxMint' and ansible_lsb.major_release|int == 21
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
  loop:
    # libproj22 - Cartographic projection library
    - libproj22
    # libspatialite7 - Geospatial extension for SQLite - libraries
    - libspatialite7

- name: "Install Ruby and related packages (Mint 19)"
  when: ansible_lsb.id == 'LinuxMint' and ansible_lsb.major_release|int == 19
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
  loop:
    # [lb]: 2019-01-03: Enabling these for completeness, but both already installed.
    # libproj12 - Cartographic projection library
    - libproj12
    # libspatialite7 - Geospatial extension for SQLite - libraries
    - libspatialite7

- name: "Install Ruby and related packages (Mint 18)"
  when: ansible_lsb.id == 'LinuxMint' and ansible_lsb.major_release|int == 18
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
  loop:
    - libproj0
    - libspatialite5

- name: "Install Ruby and related packages (Mint 17)"
  when: ansible_lsb.id == 'LinuxMint' and ansible_lsb.major_release|int == 17
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
  loop:
    - libproj0
    - libspatialite5

# ***
