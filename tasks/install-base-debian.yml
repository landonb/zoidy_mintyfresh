---

# IKNOW: I know the Ansible role this is published under was
# originally targeted for Linux Mint specifically (and named
# accordingly, zoidy_mintyfresh). So it would seem that this
# role has nothing to do with Debian (or Ubuntu), and that
# this task should be elsewhere. But I believe this is an
# issue with the project name, and not its scope. This role
# is mostly about apt-install'ing packages, along with a few
# Mint-specific tasks (e.g., laptop-lid-disable-wake-on.yml).
# And I'd rather that create a Debian-specific role with
# likely a lot of overlap in what apt packages it installs.
# - MAYBE: Rename the role itself...
#   - Or not, "minty fresh" is also something people say,
#     so it doesn't *have* to mean this role is only for
#     Linux Mint.
#   - Perhaps zoidy_mintyfresh →
#             zoidy_aptinstall ??
#             zoidy_aptslather ??
#             zoidy_pkginstall ??
#             zoidy_apt_deploy ??
#             zoidy_installapt ??
#             zoidy_apt_plonkr ??

# REFER/2025-01-15:
#   ansible_lsb∷
#     {'id': 'Debian',
#      'description': 'Debian GNU/Linux 12 (bookworm)',
#      'release': '12',
#      'codename': 'bookworm',
#      'major_release': '12'
#     }"}

- name: Install Debian base packages
  when: ansible_lsb.id == 'Debian' and ansible_lsb.major_release|int >= 12
  become: true
  ansible.builtin.apt: name={{ item }}
  loop:

    # *** Packages author needs to onboard new Debian environment,
    #     and to enable (most) of the DepoXy environment features.

    # SAVVY: You'll likely install this package manually on new host,
    # then switch to @control host to run Ansible tasks over SSH.
    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-develop-sec.yml
    - openssh-server

    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-develop-net.yml
    - rsync

    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-develop-vim.yml
    - vim-gtk3

    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-desktop-font.yml
    - fonts-hack

    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-develop-vcs.yml
    - tig

    # `dc`, for tig-newtons rebase operations (to inject commented tag into
    # git-rebase-todo final rebase exec, a trick w/in a trick w/in a trick).
    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-develop-vcs.yml
    - dc

    # `fd`, 'nuff said.
    # - On Linux Mint 19.3, this is found in the 'fd' package.
    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-develop-misc.yml
    - fd-find

    # For at least mounting gocryptfs stores:
    #   ~/.kit/ansible/roles/zoidy_troglodyte/tasks/cli-gocryptfs.yml
    # Also used by sh-humble-prompt to process GNOME Shell Extension
    # `gdbus call` responses for `window-calls`, to number terminal windows
    # and to wire numbered-window focus/minimize window toggle accelerators:
    #   ~/.kit/sh/sh-humble-prompt/lib/show-command-name-in-window-title.sh
    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-develop-lang.yml
    - jq

    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-develop-grep.yml
    # `rg`
    - ripgrep
    # `awk`, so many of author's shell functionality uses `awk`.
    # - E.g., including processing `rg` results for Vim quickfix window:
    #     https://github.com/landonb/dubs_grep_steady#🧐
    #       https://github.com/landonb/dubs_grep_steady/blob/1.6.0/bin/vim-grepprg-rg-sort
    #     ~/.vim/pack/landonb/start/dubs_grep_steady/bin/vim-grepprg-rg-sort
    - gawk

    # For mounting NAS, to restore user home directory, etc.
    #   ~/.kit/ansible/zoidy/roles/zoidy_my_cp_dirs/tasks/sync-assure-mounted-nas.yml
    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-develop-misc.yml
    - nfs-common

    # OPSEC-related packages:
    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_troglodyte/tasks/install-packages-opsec.yml
    #
    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-develop-terminal.yml
    - expect
    #
    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-develop-sec.yml
    - pass
    - tomb
    #
    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-develop-net.yml
    - ufw

    # So that at least `pass` completion works.
    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-develop-terminal.yml
    - bash-completion

    # INERT/2025-01-15: Consider enabling unattended-upgrades:
    #   ~/.kit/ansible/roles/zoidy_troglodyte/tasks/unattended-installs.yml
    # - Though for now, author plans to manage manually:
    #   - It's less risky to leave u-u disabled.
    #     - For instance, you'd hate to wake up and find your workhorse
    #       unusable because of a buggy update — and although this rarely
    #       happens, it *does* happen, and it happened a few months ago
    #       when `pass` broke because of a buggy `tree` release! (sometimes
    #       it's the old, stable, legacy apps you least suspect!).
    #   - If you enabled this, you'd have to decide how you want to manage
    #     rebooting.
    #     - You could enable automatic reboots, but I think everyone hates
    #       those.
    #     - You'd probably want to send an email after u-u runs that shows
    #       a list of changes and also alerts you if you need to restart.
    #       - For years past, author had `mintupdate-automation upgrade`
    #         enabled on Linux Mint. But I had no email alert, so I never
    #         know when I needed to reboot, and I rarely did:
    #           ~/.kit/ansible/roles/zoidy_troglodyte/tasks/unattended-installs.yml
    #
    # - unattended-upgrades
    # - apt-listchanges

    # Search for files within Debian packages. Especially useful when
    # onboarding a new distro.
    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-desktop-core.yml
    - apt-file

    # `nslookup`, for myrepos/ohmyrepos 'ffssh' action (`ff`).
    # - Used to sync Git repos between local hosts.
    # - On LM 19.3, nslookup is from 'dnsutils'.
    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-develop-net.yml
    - bind9-dnsutils

    # For building from sources, etc.
    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-build-essentials.yml
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-develop-python.yml
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-develop-ruby.yml
    - build-essential

    # Not necessarily essential, but Meld might be useful while onboarding a
    # new host (the whole point of this task file, install-base-debian, is to
    # install a core set of immediately useful apt packages, and not to spend
    # how many ever minutes installing all the apt packages from this role,
    # zoidy_mintyfresh... though I admit the latest runtime (2025-01-15) for
    # the entire role wasn't really that long).
    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-desktop-core.yml
    - meld

    # DUNNO: Am I just making one all-inclusive list? Is there really a point
    # to this list? Maybe it's a just ranking of my favorite apt packages....
    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-develop-sec.yml
    - pwgen

    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-develop-net.yml
    - curl
    - wget

    # While generally not useful in GNOME Shell, a few windows are still X,
    # including GVim. This enables `gvim-open-kindness` to front and focus
    # the GVim window.
    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-desktop-core.yml
    #  - wmctrl
    - xdotool

    # For running DepoXy OMR 'infuse' command.
    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-develop-text.yml
    - m4
    # - CALSO:
    #   ~/.kit/ansible/roles/zoidy_mintyfresh/tasks/install-develop-image.yml
    - texlive

