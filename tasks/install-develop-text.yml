---

- name: 'Install apps to help working with text in the terminal'
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
  loop:

    # 2017-05-23: What is with wanting to save color output to a file?
    #   ls --color=always | aha --black > ls-with-colors.html
    # aha - ANSI color to HTML converter
    - aha
    # You can also pygmentize exiting files.
    #   pygmentize file.pl | \
    #     grep -i --color=always version | \
    #     aha --black > ls-with-colors.html

    # https://github.com/sharkdp/bat
    - bat

    # Text-to-speech apps:
    #   espeak
    #   festival
    #   pico2wave (libttspico-utils)
    #   gtts-cli (python3-gtts)
    - espeak

    # So `less` can highlight source code, e.g.,
    #   LESSOPEN="| /usr/bin/highlight %s --out-format xterm256 --force"
    - highlight

    - m4

    # A colorful, more clever `tail` command.
    # multitail - view multiple logfiles windowed on console
    - multitail

    # Author prefers `less` (aka `more` with color) over `most`.
    #  - most

    # python3-pygments - syntax highlighting package written in Python 3
    - python3-pygments

    # ISOFF/2025-11-11: I haven't used wkhtmltopdf in recent memory, and
    # it has not been released to APT in a few cycles (not since Debian 11,
    # circa 2020-06-11):
    #   https://wkhtmltopdf.org/downloads.html
    # - REFER:
    #   https://github.com/wkhtmltopdf/wkhtmltopdf
    #   https://wkhtmltopdf.org/
    #
    # Use wkhtmltopdf to generate PDFs from HTML, e.g., those generated from reST.
    # - [MEH: This project is not as "text"-related as m4, bat, etc., but this
    #    is the best file for it (or maybe install-develop-misc.yml? Meh).
    #  - wkhtmltopdf

# ***

- name: 'Install distro-specific acbde-related packages (Debian 12)'
  when: ansible_lsb.id == 'Debian' and ansible_lsb.major_release|int == 12
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
  loop:
    # "International Components for Unicode"
    - libicu72

- name: "Install Ruby and related packages (Mint 21)"
  when: ansible_lsb.id == 'LinuxMint' and ansible_lsb.major_release|int == 21
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
  loop:
    # "International Components for Unicode"
    - libicu70

- name: "Install Ruby and related packages (Mint 19)"
  when: ansible_lsb.id == 'LinuxMint' and ansible_lsb.major_release|int == 19
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
  loop:
    # "International Components for Unicode"
    # Ubuntu 16.04: libicu52
    # Ubuntu 18.04: libicu60
    - libicu60

- name: "Install Ruby and related packages (Mint 18)"
  when: ansible_lsb.id == 'LinuxMint' and ansible_lsb.major_release|int == 18
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
  loop:
    # "International Components for Unicode"
    - libicu52

- name: "Install Ruby and related packages (Mint 17)"
  when: ansible_lsb.id == 'LinuxMint' and ansible_lsb.major_release|int == 17
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
  loop:
    # "International Components for Unicode"
    - libicu52

# ***
