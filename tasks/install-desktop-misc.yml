---

- name: 'Install desktop apps — misc (Mint-only)'
  when: ansible_lsb.id == 'LinuxMint'
  become: true
  ansible.builtin.apt: name={{ item }}
  loop:

    # "lets you dock any application into the system tray"
    - kdocker

    # Installs `notify-send` desktop notifications app.
    # - HSTRY/2025-01-16: This is a dependency of one or more other
    #   packages installed by zoidy_mintyfresh on Debian 12. I.e.,
    #   it'll be installed whether listed here or not if you play
    #   the full role.
    - libnotify-bin

