---

- name: 'Install grepper packages (not including `rg`)'
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
  loop:

    # [lb]: I don't personally use ack, but sometimes I copy-paste it.
    # "grep-like program specifically for large source trees"
    - ack

    # On Debian 12, built-in `awk` is `mawk`, and:
    #   /usr/bin/awk -> /etc/alternatives/awk
    #   /etc/alternatives/awk -> /usr/bin/mawk
    # After installing this package:
    #   /etc/alternatives/awk -> /usr/bin/gawk
    - gawk

    # pcre2-utils - New Perl Compatible Regular Expression Library - utilities
    # - For pcre2grep (née pcregrep), for when you need Perl-style
    #   Perl 5-compatible regex (for, e.g., lookahead and lookbehind).
    # - CXREF: pcre2grep also ensured by DepoXy OMR tig 'install' task, e.g.:
    #     mr -d ~/.kit/git/tig -n install
    #   ~/.depoxy/ambers/home/.kit/git/_mrconfig-git-core
    # - CALSO: Homebrew pcre2.
    #   - (On macOS, the tig 'install' task brew-installs pcre2,
    #      which includes pcre2grep (and pcregrep).)
    - pcre2-utils

    # ripgrep is the fastest searcher! > ag > grep
    # - 2024-02-06: Linux Mint 21.3 includes ripgrep 13.0.0
    # - REFER: For the latest ripgrep (curr. 14.1.0), see:
    #     https://github.com/landonb/zoidy_apps_et_al
    #   CXREF: On a DepoXy install, located at:
    #     ~/.kit/ansible/roles/zoidy_apps_et_al/tasks/cli-ripgrep.yml
    - ripgrep

    # The stately Silver Search, ag.
    - silversearcher-ag

# ***
